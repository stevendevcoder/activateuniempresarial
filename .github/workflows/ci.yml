name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pausas_admin
          POSTGRES_PASSWORD: pausas_admin
          POSTGRES_DB: pausas_activas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pausas_admin -d pausas_activas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npm test
        env:
          DATABASE_URL: postgres://pausas_admin:pausas_admin@localhost:5432/pausas_activas
          JWT_SECRET: test-secret-for-ci
          NODE_ENV: test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npx ng build --configuration production
