services:
  db:
    image: postgres:16-alpine
    container_name: pausas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pausas_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pausas_admin}
      POSTGRES_DB: ${POSTGRES_DB:-pausas_activas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pausas_admin} -d ${POSTGRES_DB:-pausas_activas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pausas_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@pausas.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: