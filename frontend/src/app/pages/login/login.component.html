<main class="login">
  <section class="hero">
    <app-logo [size]="96" />
    <h1>ACTIVATE</h1>
    <p class="brand">UNIEMPRESARIAL</p>
    <svg class="wave" viewBox="0 0 430 72" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 72V28C78 58 150 6 230 28C310 50 360 8 430 32v40z" fill="#f3f5fb" />
    </svg>
  </section>

  <section class="body">
    <p class="tagline">Bienestar que se mueve contigo.</p>
    <div class="dots" aria-hidden="true">
      <span></span>
      <span class="navy"></span>
      <span class="red"></span>
      <span></span>
      <span></span>
    </div>

    @if (errorMessage) {
      <p class="error">{{ errorMessage }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <label for="email">Correo institucional</label>
      <div class="field">
        <app-icon class="lead" name="mail" />
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="usuario@uniempresarial.edu.co"
          autocomplete="username"
        />
      </div>

      <label for="password">Contraseña</label>
      <div class="field">
        <app-icon class="lead" name="lock" />
        <input
          id="password"
          [type]="hidePassword ? 'password' : 'text'"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
        <button type="button" class="eye" (click)="hidePassword = !hidePassword" [attr.aria-label]="hidePassword ? 'Mostrar contraseña' : 'Ocultar contraseña'">
          <app-icon [name]="hidePassword ? 'eye-off' : 'eye'" />
        </button>
      </div>

      <button type="submit" class="submit" [disabled]="form.invalid || loading">
        {{ loading ? 'Ingresando…' : 'Iniciar sesión' }}
      </button>
    </form>

    <p class="forgot">¿Olvidaste tu contraseña?</p>
    <p class="hint">Si no recuerdas tu contraseña, solicita el restablecimiento a Talento Humano.</p>
  </section>

  <div class="bars" aria-hidden="true">
    <span style="height:22px"></span>
    <span style="height:38px"></span>
    <span class="pink" style="height:54px"></span>
    <span style="height:28px"></span>
    <span style="height:44px"></span>
    <span style="height:20px"></span>
    <span style="height:34px"></span>
  </div>
</main>
