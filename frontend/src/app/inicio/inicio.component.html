<main class="min-h-dvh bg-brand-surface p-6 lg:p-10">
  <div class="max-w-5xl mx-auto">
    <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-brand-blue flex items-center justify-center text-white shadow-md">
          <lucide-angular [img]="ic.Activity" class="w-6 h-6"></lucide-angular>
        </div>
        <div>
          <h1 class="text-xl font-extrabold text-brand-blue tracking-tight">Hola, bienvenido a FitCampus</h1>
          <p class="text-sm text-slate-500">Sesión iniciada correctamente.</p>
        </div>
      </div>
      <button
        (click)="logout()"
        class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl border border-slate-200 bg-white text-brand-blue text-sm font-bold hover:bg-brand-soft-blue transition-colors"
      >
        <lucide-angular [img]="ic.LogOut" class="w-4 h-4"></lucide-angular>
        Cerrar sesión
      </button>
    </header>

    <section class="rounded-3xl border border-brand-soft-blue bg-white p-8 shadow-sm">
      <h2 class="text-lg font-bold text-slate-800 mb-2">Módulos próximamente</h2>
      <p class="text-sm text-slate-500 leading-relaxed">
        Este es el punto de entrada posterior al login. Aquí llegarán los módulos de
        <strong>pausas</strong> y <strong>rutinas</strong> según la estructura del proyecto.
      </p>
    </section>
  </div>
</main>
